[workspace]
resolver = "2"
members = ["crates/tc-core", "crates/worker", "crates/browser", "crates/android", "crates/hook-shim"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.91"

# The lints every crate inherits (`[lints] workspace = true`). CI runs clippy with `-D warnings`, so each one is an error
# there. `clippy.toml` keeps tests out of the panic-family lints. A lint that is wrong for one place is allowed there
# with `#[allow(..)]` and a reason, not removed from this list.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_import_braces = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
# Code that can panic or write where it should not. A failure is returned (or, where it truly cannot happen, handled by
# a pattern that shows why), never unwrapped.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
let_underscore_must_use = "warn"
undocumented_unsafe_blocks = "warn"
mem_forget = "warn"
exit = "warn"
# Hidden copies, and code that reads differently from what it does.
cloned_instead_of_copied = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_assert = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
needless_continue = "warn"
ref_option = "warn"
used_underscore_binding = "warn"
wildcard_imports = "warn"
checked_conversions = "warn"
large_types_passed_by_value = "warn"
fn_params_excessive_bools = "warn"
no_effect_underscore_binding = "warn"
enum_glob_use = "warn"
range_plus_one = "warn"
stable_sort_primitive = "warn"
unnecessary_wraps = "warn"
match_wildcard_for_single_variants = "warn"
option_option = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unused_self = "warn"
default_trait_access = "warn"
ignored_unit_patterns = "warn"
trivially_copy_pass_by_ref = "warn"
unnested_or_patterns = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
needless_raw_string_hashes = "warn"
cast_lossless = "warn"
redundant_closure_for_method_calls = "warn"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# `strip = true` breaks wasm-bindgen's catch wrappers; `panic = "abort"` and "z" were measured:
# no size win / ~25% slower requests for 5% less gzip.
strip = "debuginfo"

# The Android app's library: the release settings, with the symbols taken out (they are 3 of its 8 MB, and a phone has no
# use for them). `scripts/build-android.mjs` builds with it. (Not the release profile itself: `strip = true` breaks
# wasm-bindgen's catch wrappers there.)
[profile.android]
inherits = "release"
strip = true

# Optimise for size, except the crypto that runs on every cold isolate: PBKDF2 (600k rounds)
# plus decrypt. At opt-level 3 a cold start drops from ~430 ms to ~255 ms for ~2 KB of wasm.
[profile.release.package.sha2]
opt-level = 3
[profile.release.package.pbkdf2]
opt-level = 3
[profile.release.package.hmac]
opt-level = 3
[profile.release.package.chacha20poly1305]
opt-level = 3
[profile.release.package.chacha20]
opt-level = 3
[profile.release.package.poly1305]
opt-level = 3

# Key derivation is 600k PBKDF2 iterations; keep it fast in debug builds and tests.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
