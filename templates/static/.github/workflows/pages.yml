# Publishes Meghnaad's static web app to GitHub Pages: the release named in `meghnaad-version` (or the latest), checked
# against its SHA-256. Turn Pages on with "GitHub Actions" as the source (Settings -> Pages). It runs on a push, by hand,
# and once a week, so `latest` keeps up with new releases.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Download the site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node fetch-release.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
