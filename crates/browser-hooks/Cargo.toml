[package]
name = "tc-browser-hooks"
version.workspace = true
description = "The hooks of the static web app: tc-core's Lua runner as WebAssembly, loaded by the page only when a hook runs"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tc-core = { path = "../tc-core", default-features = false, features = ["lua"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
