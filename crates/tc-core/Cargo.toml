[package]
name = "tc-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "TaskChampion cloud-sync protocol (crypto, object layout, ops, replica) with no platform dependencies"

[dependencies]
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
getrandom = "0.2"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
taskchampion = { version = "3.1", default-features = false }
thiserror = "2"
uuid = { version = "1", default-features = false, features = ["serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1", default-features = false, features = ["serde", "js"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
