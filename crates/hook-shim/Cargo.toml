[package]
name = "tc-hook"
version = "0.1.0"
description = "Your Lua hooks script as Taskwarrior hooks for the real `task` CLI: the same interpreter and library the web app and the phone use"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "meghnaad-hook"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
pollster = "0.4"
serde_json = "1"
tc-core = { path = "../tc-core", default-features = false, features = ["lua"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
uuid = { version = "1", default-features = false }
