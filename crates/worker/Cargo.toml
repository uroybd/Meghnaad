[package]
name = "tw-worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Cloudflare Worker exposing a TaskChampion replica (backed by R2) as a JSON API"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
console_error_panic_hook = "0.1"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taskchampion = { version = "3.1", default-features = false }
tc-core = { path = "../tc-core" }
tokio = { version = "1", default-features = false, features = ["sync"] }
uuid = { version = "1", default-features = false, features = ["serde"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Crypto", "CryptoKey", "Headers", "Response", "SubtleCrypto"] }
worker = "0.8"
