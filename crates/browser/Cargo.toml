[package]
name = "tc-browser"
version.workspace = true
description = "The Taskwarrior engine for the browser: tc-core as WebAssembly, syncing through the Worker"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The static flavour (no Worker): sync and settings on a git branch through the forge's API, unlocked in the page. Only
# that build carries it (`node scripts/build-engine.mjs --static`): it is several hundred KB the Worker flavours don't need.
git = []

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
js-sys = "0.3"
serde_json = "1"
taskchampion = { version = "3.2", default-features = false }
tc-core = { path = "../tc-core" }
uuid = { version = "1", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
