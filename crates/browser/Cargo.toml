[package]
name = "tc-browser"
version = "0.1.0"
description = "The Taskwarrior engine for the browser: tc-core as WebAssembly, syncing through the Worker"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
async-trait = "0.1"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taskchampion = { version = "3.1", default-features = false }
tc-core = { path = "../tc-core" }
uuid = { version = "1", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
