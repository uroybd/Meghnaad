# Builds the app once and publishes it, versioned, for both ways of using it:
#   - the web app, ready to deploy with no Rust or build needed: the `release` branch holds the built files (it is what the
#     Deploy to Cloudflare button points at), and a tag also attaches them to a GitHub release as a .tar.gz;
#   - the Android app, as an APK: attached to the release for a tag, or kept as the run's artifact;
#   - meghnaad-hook, the Lua hooks script for the real `task`, as a program for Linux and macOS (x86_64 and arm64), the same way,
#     and, when the repository names a Homebrew tap (docs/deploy.md), its formula there.
# The version is the one in package.json. To release: change it there, commit, then tag that commit `v<version>` and push
# the tag (git tag v0.2.0 && git push origin v0.2.0). A tag that does not match package.json is refused. A run by hand
# (Actions > "Release" > Run workflow) builds the same things as `<version>-dev.<commit>` and publishes only the branch.
# The APK is signed when the repository has the secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (docs/android.md says how to make them); without them it is a debug build,
# which installs but cannot be updated in place by a later release.
# It does not run the tests: CI does that on every push, so release a commit CI has passed. How the web package is made
# is scripts/package-release.mjs.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# One release at a time; a second run waits instead of racing the first to the branch.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # A tag has to be the version in package.json; anything else is `<version>-dev.<commit>`.
      - name: Version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          declared="$(node scripts/version.mjs)"
          if [ "$REF_TYPE" = tag ]; then
            if [ "$REF_NAME" != "v$declared" ]; then
              echo "::error::The tag $REF_NAME does not match the version in package.json (v$declared). Change it there, commit, and tag again."
              exit 1
            fi
            version="$declared"
          else
            version="$declared-dev.${GITHUB_SHA::7}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Releasing $version"

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install worker-build
        run: command -v worker-build >/dev/null || cargo install worker-build --locked

      # The web app, the engine that runs in the browser, and the Worker. The web app shows the version in Settings.
      - name: Build
        env:
          APP_VERSION: ${{ env.VERSION }}
        run: node scripts/build.mjs

      - name: Package
        run: |
          node scripts/package-release.mjs --out "$RUNNER_TEMP/release" --version "$VERSION"
          echo "Worker: $(gzip -9 -c "$RUNNER_TEMP/release/worker/index_bg.wasm" | wc -c) bytes compressed"
          tar -czf "$RUNNER_TEMP/meghnaad-$VERSION.tar.gz" -C "$RUNNER_TEMP/release" .

      # The branch only ever gains commits (nothing is force-pushed), each one the whole built tree.
      - name: Publish to the release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          repo="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$repo" release >/dev/null; then
            git clone --quiet --branch release --single-branch "$repo" "$RUNNER_TEMP/branch"
          else
            git init --quiet -b release "$RUNNER_TEMP/branch"
            git -C "$RUNNER_TEMP/branch" remote add origin "$repo"
          fi
          find "$RUNNER_TEMP/branch" -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -R "$RUNNER_TEMP/release/." "$RUNNER_TEMP/branch/"
          cd "$RUNNER_TEMP/branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "The release branch already has exactly this build."
          else
            git commit --quiet -m "Release $VERSION (from ${GITHUB_SHA::7})"
            git push --quiet origin release
          fi

      - name: Create the GitHub release
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          **Web app**: deploy it with the [Deploy to Cloudflare](https://deploy.workers.cloudflare.com/?url=https://github.com/${GITHUB_REPOSITORY}/tree/release) button, or with \`npm run setup\` from the \`release\` branch ([Deploying](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/deploy.md)). \`meghnaad-$VERSION.tar.gz\` is the same built package.

          **Hooks with the real \`task\`**: \`meghnaad-hook-$VERSION-<platform>.tar.gz\` is the program that runs your Lua hooks script for \`task\` ([the same script with the real task](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/using.md#the-same-script-with-the-real-task)); the builds are added to this release when they finish.

          **Android app**: install \`meghnaad-$VERSION.apk\` ([the Android app](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/android.md)); it is added to this release when its build finishes.

          NOTES
          sed -i 's/^          //' "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$RUNNER_TEMP/meghnaad-$VERSION.tar.gz" --title "Meghnaad $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes --verify-tag

  # meghnaad-hook (the Lua hooks script for the real `task`) as a program per platform, so that it installs with no Rust:
  # `meghnaad-hook-<version>-<target>.tar.gz`, attached to a tag's release or kept as the run's artifact.
  hook:
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build and package
        env:
          REF_TYPE: ${{ github.ref_type }}
          TARGET: ${{ matrix.target }}
        run: |
          declared="$(node scripts/version.mjs)"
          if [ "$REF_TYPE" = tag ]; then version="$declared"; else version="$declared-dev.${GITHUB_SHA::7}"; fi
          cargo build --release --locked -p tc-hook --target "$TARGET"
          name="meghnaad-hook-$version-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/meghnaad-hook" "$name/"
          tar -czf "$name.tar.gz" "$name"
          echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: meghnaad-hook-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

      - name: Attach to the GitHub release
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" "$ARCHIVE" --clobber

  # meghnaad-hook in a Homebrew tap, so `brew install <owner>/tap/meghnaad-hook` installs it: the formula is rewritten for the tag
  # from the builds above (so it waits for all four, and a partial release makes none). It runs only for a release version
  # (not `1.2.3-rc.1`), in a repository that says which tap (the variable HOMEBREW_TAP, `owner/homebrew-tap`) and has a token
  # that can push to it (the secret HOMEBREW_TAP_TOKEN: a fine-grained token with Contents read and write on that repository).
  tap:
    needs: hook
    if: ${{ github.ref_type == 'tag' && vars.HOMEBREW_TAP != '' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAP: ${{ vars.HOMEBREW_TAP }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check there is a token
        if: ${{ env.TAP_TOKEN == '' }}
        run: |
          echo "::warning::HOMEBREW_TAP is $TAP but there is no HOMEBREW_TAP_TOKEN secret: the formula is not updated"

      - uses: actions/checkout@v4
        if: ${{ env.TAP_TOKEN != '' }}

      - uses: actions/setup-node@v4
        if: ${{ env.TAP_TOKEN != '' }}
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        if: ${{ env.TAP_TOKEN != '' }}
        with:
          pattern: meghnaad-hook-*
          path: hook
          merge-multiple: true

      - name: Update the formula
        if: ${{ env.TAP_TOKEN != '' }}
        run: |
          version="$(node scripts/version.mjs)"
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/$TAP.git" tap
          mkdir -p tap/Formula
          node scripts/homebrew-formula.mjs --repo "$GITHUB_REPOSITORY" --version "$version" hook > tap/Formula/meghnaad-hook.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/meghnaad-hook.rb
          if git diff --cached --quiet; then echo "The formula is already for $version."; exit 0; fi
          git commit -m "Update meghnaad-hook to v$version"
          git push

  # After the release exists, so that a tag's APK can be added to it.
  android:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked

      # The same version as the web app's (the `release` job has already refused a tag that is not package.json's).
      - name: Build the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REF_TYPE: ${{ github.ref_type }}
          # Where the app looks for a newer version: this repository's latest release.
          ANDROID_UPDATE_REPO: ${{ github.repository }}
        run: |
          declared="$(node scripts/version.mjs)"
          if [ "$REF_TYPE" = tag ]; then version="$declared"; else version="$declared-dev.${GITHUB_SHA::7}"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          export APP_VERSION="$version" ANDROID_VERSION_NAME="$version" ANDROID_VERSION_CODE="$(node scripts/version.mjs code)"
          if [ "$HAS_KEYSTORE" = true ]; then
            printf %s "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
            node scripts/build-android.mjs --release
            cp app/androidApp/build/outputs/apk/release/androidApp-release.apk "meghnaad-$version.apk"
          else
            echo "::warning::No Android keystore secrets: building a debug-signed APK"
            node scripts/build-android.mjs
            cp app/androidApp/build/outputs/apk/debug/androidApp-debug.apk "meghnaad-$version-debug.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: meghnaad-*.apk

      - name: Attach to the GitHub release
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" meghnaad-*.apk --clobber
