# Tests and lint on every push to main and every pull request. (Deploying is a separate, manual workflow.)
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch or PR replaces the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (format, tests, clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # rustfmt.toml in the repository root sets the style (120 columns). Run `cargo fmt` to fix.
      - name: Format
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --workspace

      # `-D warnings`: the code is clippy-clean, keep it that way. The Worker is built for WebAssembly,
      # so it is linted for that target.
      - name: Clippy (engine)
        run: cargo clippy -p tc-core --all-targets --features lua -- -D warnings

      - name: Clippy (Worker, WebAssembly)
        run: cargo clippy -p tw-worker --target wasm32-unknown-unknown -- -D warnings

      # The engine that runs in the browser is built for WebAssembly too.
      - name: Clippy (engine for the browser, WebAssembly)
        run: cargo clippy -p tc-browser --target wasm32-unknown-unknown -- -D warnings

      # The engine in the Android app (native, with the S3 client and the JNI layer); linted for this machine, which
      # checks the same code.
      - name: Clippy (engine for Android)
        run: cargo clippy -p tc-android --all-targets -- -D warnings

  web:
    name: Web app and scripts (format, lint, tests, type check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Prettier and ESLint (config in .prettierrc.json and eslint.config.js). Run `npm run format` to fix.
      - name: Format and lint
        run: npm run lint:js

      - name: Type and accessibility check
        run: npm run check

      # The web tests load the engine's WebAssembly (the page's helpers are Rust: dates in the user's format), which
      # `npm --prefix web test` builds first when it is out of date: so the Rust toolchain is here before them.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Web tests
        run: npm --prefix web test

      - name: Deploy-script tests
        run: node --test scripts/*.test.mjs

      # The app has to build, not just pass its tests. That includes the engine that runs in the browser (Rust compiled to
      # WebAssembly, then wasm-bindgen), which `build:web` builds first (the tests above built it already, and it is
      # not built again); wasm-bindgen's tool is installed if missing.
      - name: Build
        run: npm run build:web

  # The Android app (`app/`, Kotlin): its tests on the JVM (the screens' logic, what the widgets show of a task), with the
  # engine's library built for this machine so that the tests that run the real engine do (they skip without it), and the
  # debug APK. There is no formatter or linter for Kotlin yet.
  android:
    name: Android app (tests, debug build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Engine library for this machine
        run: cargo build --profile android -p tc-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The Android SDK is on the runner (ANDROID_HOME); the project finds it there.
      - name: Tests and debug build
        working-directory: app
        run: ./gradlew :shared:desktopTest :shared:testDebugUnitTest :androidApp:testDebugUnitTest :androidApp:assembleDebug
